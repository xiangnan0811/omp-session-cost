name: Apply validated 0.9.1 repair
on:
  push:
    branches: [fix/report-completeness-0.9.1]
    paths:
      - '.repair-v0.9.1.part*'
      - '.github/workflows/apply-repair-v0.9.1.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.22'
      - name: Apply checksummed repair and verify exact tested tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 8a21744856f9b226a26603d03d19268d2b29131e
          cat .repair-v0.9.1.part0 .repair-v0.9.1.part1 .repair-v0.9.1.part2 > "$RUNNER_TEMP/repair.patch.gz"
          echo "4f3335428a636d73e9530372fba1c244bf08fdc1ec46e456f3e683fb0a5c3525  $RUNNER_TEMP/repair.patch.gz" | sha256sum -c -
          gzip -dc "$RUNNER_TEMP/repair.patch.gz" > "$RUNNER_TEMP/repair.patch"
          git apply --check --unidiff-zero "$RUNNER_TEMP/repair.patch"
          git apply --unidiff-zero "$RUNNER_TEMP/repair.patch"
          rm .repair-v0.9.1.part0 .repair-v0.9.1.part1 .repair-v0.9.1.part2 .github/workflows/apply-repair-v0.9.1.yml
          git add -A
          git diff --cached --check
          test "$(git write-tree)" = cc6f8ebeef254fbe0e15e90d3454f663bfe2ca19
      - name: Validate complete candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/repair-validation"
          npm run check | tee "$RUNNER_TEMP/repair-validation/node-tests.log"
          bun scripts/check-bun.mjs | tee "$RUNNER_TEMP/repair-validation/bun.log"
          node scripts/benchmark.mjs 20000 | tee "$RUNNER_TEMP/repair-validation/benchmark.json"
          node scripts/example.mjs dist
          node scripts/verify-report.mjs dist/example-diagnostic.md | tee "$RUNNER_TEMP/repair-validation/markdown.json"
          node scripts/verify-report.mjs dist/example-diagnostic.json | tee "$RUNNER_TEMP/repair-validation/json.json"
          npm pack --pack-destination dist
          node scripts/verify-package.mjs dist/omp-session-cost-0.9.1.tgz | tee "$RUNNER_TEMP/repair-validation/package.log"
      - name: Commit only the clean tested tree to repair branch
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          test "$(git write-tree)" = cc6f8ebeef254fbe0e15e90d3454f663bfe2ca19
          git config user.name 'xiangnan0811'
          git config user.email '39794889+xiangnan0811@users.noreply.github.com'
          git commit -m 'fix: retain execution and acceptance evidence (v0.9.1)'
          git push origin HEAD:refs/heads/fix/report-completeness-0.9.1
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/repair-validation/source.txt"
          git archive --format=zip HEAD -o "$RUNNER_TEMP/repair-validation/validated-source.zip"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repair-validation-v0.9.1
          path: ${{ runner.temp }}/repair-validation/
          retention-days: 7
