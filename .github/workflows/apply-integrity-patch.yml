name: Apply verified integrity repair

on:
  push:
    branches: [fix/0.9.0-data-integrity]
    paths: [.ci/repair-09.part-1.b64]

permissions:
  contents: write

concurrency:
  group: apply-integrity-repair-09
  cancel-in-progress: false

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.22'
      - name: Apply exact locally verified source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = b3df9f09e17c62cfb6a855a1834c6326b1bb977e
          python3 - <<'PY'
          import base64, hashlib, lzma, os, pathlib
          parts = [pathlib.Path(f'.ci/repair-09.part-{i}.b64') for i in range(1, 6)]
          encoded = b''.join(p.read_bytes() for p in parts)
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          expected = 'f3c9d926b34f56ba869ecee34e147765ba828678b65b881a86103f576f24afdf'
          assert hashlib.sha256(patch).hexdigest() == expected, 'Patch digest mismatch'
          pathlib.Path(os.environ['RUNNER_TEMP'], 'repair.patch').write_bytes(patch)
          PY
          git apply --check "$RUNNER_TEMP/repair.patch"
          git apply "$RUNNER_TEMP/repair.patch"
          rm -- .ci/repair-09.part-{1,2,3,4,5}.b64 .github/workflows/apply-integrity-patch.yml
          rmdir .ci
          git add -A
          test "$(git write-tree)" = b57aa988fd6357c7da3cb99be77624fb6eb2e163
          git diff --cached --check
      - name: Node regression suite and large sample
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          npm run check | tee dist/node-validation.log
          node scripts/benchmark.mjs 20000 | tee dist/benchmark.json
      - name: Bun SQLite and registration integration
        run: bun scripts/check-bun.mjs
      - name: Verify isolated package and portable reports
        shell: bash
        run: |
          set -euo pipefail
          node scripts/example.mjs dist
          node scripts/verify-report.mjs dist/example-diagnostic.md > dist/markdown-verification.json
          node scripts/verify-report.mjs dist/example-diagnostic.json > dist/json-verification.json
          npm pack --pack-destination dist
          node scripts/verify-package.mjs dist/omp-session-cost-0.9.0.tgz
          test "$(git write-tree)" = b57aa988fd6357c7da3cb99be77624fb6eb2e163
      - name: Commit validated source on repair branch only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: repair collection, task lineage and portable evidence for 0.9.0'
          test "$(git rev-parse HEAD^{tree})" = b57aa988fd6357c7da3cb99be77624fb6eb2e163
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          CURRENT=$(git -c "http.https://github.com/.extraheader=Authorization: basic $AUTH" ls-remote origin refs/heads/fix/0.9.0-data-integrity | cut -f1)
          test "$CURRENT" = "$GITHUB_SHA"
          git -c "http.https://github.com/.extraheader=Authorization: basic $AUTH" push origin HEAD:refs/heads/fix/0.9.0-data-integrity
          git rev-parse HEAD > dist/validated-commit.txt
          git archive --format=zip HEAD -o "$RUNNER_TEMP/validated-source.zip"
          (cd dist && sha256sum omp-session-cost-0.9.0.tgz > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: integrity-repair-validated-source
          path: ${{ runner.temp }}/validated-source.zip
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: integrity-repair-validation
          path: dist/
          retention-days: 7
