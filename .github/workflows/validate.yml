name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: node scripts/benchmark.mjs 20000
      - run: node scripts/example.mjs dist
      - run: node scripts/verify-report.mjs dist/example-diagnostic.md
      - run: node scripts/verify-report.mjs dist/example-diagnostic.json
      - run: npm pack --pack-destination dist
      - run: node scripts/verify-package.mjs "dist/omp-session-cost-$(node -p 'require("./package.json").version').tgz"
      - name: Archive validated source
        run: git archive --format=zip HEAD -o "$RUNNER_TEMP/validated-source.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: validated-source
          path: ${{ runner.temp }}/validated-source.zip
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: validated-package
          path: dist/
          retention-days: 7
  bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.22'
      - run: bun scripts/check-bun.mjs
