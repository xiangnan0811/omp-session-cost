name: Apply validated OMP 18.3 fix
on:
  push:
    branches: ['fix/omp-18.3-protocols']
    paths:
      - '.github/workflows/apply-omp183-fix.yml'
      - '.ci-omp183/**'
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'xiangnan0811/omp-session-cost' && github.ref == 'refs/heads/fix/omp-18.3-protocols'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Materialize and verify exact candidate tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = b8cdc259211a2ebf11cb2523634ec605faf3e132
          python3 - <<'PY'
          import hashlib, lzma, pathlib, os
          packed = b''.join(pathlib.Path(f'.ci-omp183/patch.{i}').read_bytes() for i in range(2))
          patch = lzma.decompress(packed)
          assert hashlib.sha256(patch).hexdigest() == '5f7a5f017e98c58e7d37c6d9b2cc1b8e497905ed423fbe30c89278a4240350bb'
          pathlib.Path(os.environ['RUNNER_TEMP'], 'candidate.patch').write_bytes(patch)
          PY
          git apply --index "$RUNNER_TEMP/candidate.patch"
          git rm -- .github/workflows/apply-omp183-fix.yml .ci-omp183/patch.0 .ci-omp183/patch.1
          git diff --cached --check
          test "$(git write-tree)" = 234862a132eef19f76a998266403ba0d3226aba3
          npm run check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: support OMP 18.3 coordination protocols (v0.9.2)'
          git push origin HEAD:refs/heads/fix/omp-18.3-protocols
